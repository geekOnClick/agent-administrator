name: agent-administrator

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: agent-administrator-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"   # FalkorDB protocol (Redis-compatible)
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  falkordb-data:
